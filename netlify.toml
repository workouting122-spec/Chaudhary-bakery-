# Netlify production deployment — Chaudhary Bake & Cake

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Set the real values in Netlify → Site settings → Environment variables:
  #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_RAZORPAY_KEY_ID

# SPA fallback: every unknown path serves index.html so React Router
# (including /admin and /admin/*) works on refresh or direct open — no 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the hashed, immutable build assets for fast repeat loads.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
